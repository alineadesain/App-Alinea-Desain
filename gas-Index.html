<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alinea Desain - Percetakan & Digital Printing</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Google Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; margin: 0; padding: 0; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
    @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 18s linear infinite; }
    .animate-marquee:hover { animation-play-state: paused; }
    @keyframes loopMarquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .animate-clients { display: flex; width: max-content; animation: loopMarquee 26s linear infinite; }
    .animate-clients:hover { animation-play-state: paused; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen bg-slate-900 flex justify-center">

  <div id="app" class="w-full max-w-2xl bg-white min-h-screen shadow-2xl flex flex-col relative pb-20">
    <!-- Header -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
      <div class="px-4 py-3 flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <div id="header-logo-container">
            <div class="w-9 h-9 rounded-xl bg-teal-600 flex items-center justify-center text-white font-black text-sm shadow">AD</div>
          </div>
          <div>
            <h1 id="header-nama-toko" class="font-bold text-sm tracking-tight leading-none text-white">Alinea Desain</h1>
            <p id="header-tagline" class="text-[10px] text-teal-300 font-medium mt-0.5 leading-none">Percetakan & Digital Printing</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div id="auth-pill" class="flex items-center gap-1.5">
            <!-- Rendered by JS: user name, role, and logout button -->
          </div>
        </div>
      </div>
      <!-- Running Text Marquee -->
      <div class="bg-teal-900/90 text-teal-100 text-[11px] font-medium px-3 py-1.5 overflow-hidden flex items-center gap-2 border-b border-teal-800">
        <span class="bg-teal-700 text-[9px] font-extrabold uppercase px-1.5 py-0.5 rounded text-white shrink-0">Info</span>
        <div class="overflow-hidden whitespace-nowrap flex-1">
          <div id="running-text-content" class="animate-marquee">
            Selamat datang di Percetakan Alinea Desain! Cetak kilat MMT & stiker presisi, konsultasi gratis, diskon kampus & instansi.
          </div>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main id="main-content" class="flex-1 p-4 overflow-y-auto">
      <div class="flex flex-col items-center justify-center py-20 text-slate-400">
        <div class="w-8 h-8 border-4 border-teal-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs mt-3 font-semibold text-slate-500">Memuat Alinea Desain App...</p>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav" class="fixed bottom-0 w-full max-w-2xl bg-white border-t border-slate-200 py-1.5 px-2 flex justify-around items-center z-40 shadow-lg">
      <!-- Injected by JS based on role -->
    </nav>
  </div>

  <script>
    const STORAGE_KEY = 'alinea_desain_gas_v5';
    const AUTH_KEY = 'alinea_gas_active_user_id';

    const DEFAULT_DATA = {
      users: [
        { ID: 'U1', Role: 'admin', KodeKhusus: '-', Nama: 'Admin Alinea', NoWA: '081234567890', Alamat: 'Yogyakarta', Password: 'admin123', Email: 'admin@alineadesain.com' },
        { ID: 'C1', Role: 'customer', KodeKhusus: '88392011', Nama: 'Budi Santoso', NoWA: '089876543210', Alamat: 'Sleman, Yogyakarta', Password: 'cust123', Email: 'budi@gmail.com' }
      ],
      products: [
        { ID: 'P1', Nama: 'Banner MMT 280gr (Outdoor/Indoor)', Kategori: 'meteran', Harga: 21000, Deskripsi: 'Bahan standar kuat untuk spanduk toko, warung, baliho. Tahan panas & hujan.', Thumbnail: 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=400&auto=format&fit=crop&q=80', Terjual: 142, HargaDesain: 15000, HargaCutting: 5000, HargaLaminating: 0 },
        { ID: 'P2', Nama: 'Banner Korea MMT 440gr Tebal', Kategori: 'meteran', Harga: 38000, Deskripsi: 'Bahan tebal premium tidak tembus pandang, warna pekat & awet.', Thumbnail: 'https://images.unsplash.com/photo-1626785774573-4b799315345d?w=400&auto=format&fit=crop&q=80', Terjual: 78, HargaDesain: 15000, HargaCutting: 5000, HargaLaminating: 0 },
        { ID: 'P3', Nama: 'Sticker Vinyl A3+ Kiss Cut Anti Air', Kategori: 'satuan', Harga: 12000, Deskripsi: 'Stiker vinyl anti air untuk label kemasan makanan/minuman UMKM.', Thumbnail: 'https://images.unsplash.com/photo-1572375992501-4b0892d50c69?w=400&auto=format&fit=crop&q=80', Terjual: 95, HargaDesain: 15000, HargaCutting: 3000, HargaLaminating: 4000 },
        { ID: 'P4', Nama: 'Kartu Nama Eksklusif (1 Box / 100 Pcs)', Kategori: 'satuan', Harga: 35000, Deskripsi: '1 box isi 100 lembar art carton 260gr dengan box mika bening.', Thumbnail: 'https://images.unsplash.com/photo-1589829085413-56de8ae18c73?w=400&auto=format&fit=crop&q=80', Terjual: 56, HargaDesain: 15000, HargaCutting: 0, HargaLaminating: 7000 },
        { ID: 'P5', Nama: 'X-Banner 60x160 cm Komplit Rangka', Kategori: 'satuan', Harga: 65000, Deskripsi: 'Stand X-Banner display aluminium + cetak visual bahan MMT tajam.', Thumbnail: 'https://images.unsplash.com/photo-1563986768494-4dee2763ff3f?w=400&auto=format&fit=crop&q=80', Terjual: 41, HargaDesain: 15000, HargaCutting: 0, HargaLaminating: 10000 }
      ],
      orders: [
        { ID: 'ORD172901', Tgl: new Date().toISOString(), KodeCustomer: '88392011', NamaCustomer: 'Budi Santoso', NoCustomer: '089876543210', IDProduk: 'P1', NamaProduk: 'Banner MMT 280gr (Outdoor/Indoor)', Kategori: 'meteran', Qty: 2, Panjang: 200, Lebar: 100, Finishing: 'Simkel (Mata Ayam)', JasaCutting: 0, JasaLaminating: 0, JasaDesain: 15000, TotalHarga: 99000, StatusBayar: 'Lunas', StatusOrder: 'Selesai', DP: 0, Catatan: 'Warna dominan biru cerah' }
      ],
      expenses: [
        { ID: 'EXP101', Tgl: new Date().toISOString().split('T')[0], Total: 350000, Toko: 'CV Bahan Grafindo', Detail: 'Beli 1 Roll Bahan MMT 280gsm', NotaUrl: '' }
      ],
      storeData: {
        nama_toko: 'Alinea Desain',
        tagline: 'Percetakan & Digital Printing Cepat Berkualitas',
        logo_url: '',
        running_text: 'Selamat datang di Alinea Desain! Promo cetak kilat MMT & stiker presisi, konsultasi gratis, diskon instansi/kampus.',
        alamat: 'Jl. Prof. Dr. Sardjito No. 45, Terban, Gondokusuman, Yogyakarta (Dekat Kampus UGM)',
        kontak: '081234567890',
        rekening: 'BCA 1234567890 a.n ALINEA DESAIN CREATIVE',
        clients_slider: [
          { id: 'c1', nama: 'Universitas Gadjah Mada', logo: 'https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=160&auto=format&fit=crop&q=80', keterangan: 'Cetak Buku Panduan, Banner Seminar & Sertifikat KKN' },
          { id: 'c2', nama: 'Universitas Diponegoro', logo: 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=160&auto=format&fit=crop&q=80', keterangan: 'Backdrop Wisuda & Souvenir Dies Natalis' },
          { id: 'c3', nama: 'Rubytech Digital', logo: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=160&auto=format&fit=crop&q=80', keterangan: 'Branding Booth Expo, X-Banner & ID Card' },
          { id: 'c4', nama: 'J&T Express Jogja', logo: 'https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=160&auto=format&fit=crop&q=80', keterangan: 'Sticker Thermal Label & Banner Outlet' }
        ]
      }
    };

    let appState = {
      currentUser: null,
      currentRole: 'customer',
      activeTab: 'home',
      adminTab: 'dashboard',
      data: DEFAULT_DATA,
      selectedProductForOrder: null
    };

    const isGas = typeof google !== 'undefined' && google.script && google.script.run;

    function formatRp(num) {
      return 'Rp ' + (Number(num) || 0).toLocaleString('id-ID');
    }

    function showToast(msg, icon = 'success') {
      Swal.fire({
        toast: true,
        position: 'top-end',
        icon: icon,
        title: msg,
        showConfirmButton: false,
        timer: 2500
      });
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch(e){}
      return DEFAULT_DATA;
    }

    function saveLocal(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch(e){}
    }

    async function initApp() {
      appState.data = loadLocal();
      
      // Auto restore login session
      const savedUid = localStorage.getItem(AUTH_KEY);
      if (savedUid && savedUid !== 'LOGGED_OUT') {
        const found = appState.data.users.find(u => u.ID === savedUid);
        if (found) {
          appState.currentUser = found;
          appState.currentRole = found.Role;
        }
      }
      if (!appState.currentUser) {
        // default preview user
        const cust = appState.data.users.find(u => u.Role === 'customer') || DEFAULT_DATA.users[1];
        appState.currentUser = cust;
        appState.currentRole = cust.Role;
      }

      // Sync with GAS backend if running on Google Apps Script
      if (isGas) {
        google.script.run
          .withSuccessHandler(serverData => {
            if (serverData && serverData.users && serverData.users.length > 0) {
              appState.data.users = serverData.users;
              appState.data.products = serverData.products || [];
              appState.data.orders = serverData.orders || [];
              appState.data.expenses = serverData.expenses || [];
              if (serverData.storeData && Array.isArray(serverData.storeData)) {
                serverData.storeData.forEach(item => {
                  if (item.Key === 'clients_slider') {
                    try { appState.data.storeData.clients_slider = JSON.parse(item.Value); } catch(e){}
                  } else if (item.Key) {
                    appState.data.storeData[item.Key] = item.Value;
                  }
                });
              }
              saveLocal(appState.data);
              renderApp();
            }
          })
          .fetchAllData();
      }

      renderApp();
    }

    function renderApp() {
      const store = appState.data.storeData;
      document.getElementById('header-nama-toko').textContent = store.nama_toko || 'Alinea Desain';
      document.getElementById('header-tagline').textContent = store.tagline || 'Percetakan & Digital Printing';
      document.getElementById('running-text-content').textContent = store.running_text || 'Selamat datang di Alinea Desain!';
      
      const logoContainer = document.getElementById('header-logo-container');
      if (store.logo_url) {
        logoContainer.innerHTML = `<img src="${store.logo_url}" class="w-9 h-9 rounded-xl object-contain bg-white p-0.5 shadow" onerror="this.outerHTML='<div class=\\'w-9 h-9 rounded-xl bg-teal-600 flex items-center justify-center text-white font-black text-sm shadow\\'>AD</div>'">`;
      } else {
        logoContainer.innerHTML = `<div class="w-9 h-9 rounded-xl bg-teal-600 flex items-center justify-center text-white font-black text-sm shadow">AD</div>`;
      }

      // Render Auth Pill
      const authPill = document.getElementById('auth-pill');
      if (appState.currentUser) {
        const isAdm = appState.currentUser.Role === 'admin';
        authPill.innerHTML = `
          <div class="flex items-center gap-1.5 bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-1">
            <span class="w-2 h-2 rounded-full ${isAdm ? 'bg-amber-400' : 'bg-emerald-400'}"></span>
            <span class="text-xs font-bold text-slate-200 truncate max-w-[100px]">${appState.currentUser.Nama.split(' ')[0]}</span>
            <span class="text-[9px] font-extrabold uppercase px-1.5 py-0.2 rounded ${isAdm ? 'bg-rose-950 text-rose-300' : 'bg-teal-950 text-teal-300'}">${isAdm ? 'Admin' : 'Cust'}</span>
          </div>
          <button onclick="handleLogout()" title="Keluar Akun" class="bg-rose-950/70 hover:bg-rose-900 text-rose-300 px-2 py-1 rounded-xl text-xs font-bold border border-rose-800 transition">Keluar</button>
        `;
      } else {
        authPill.innerHTML = `
          <button onclick="openLoginPortal()" class="bg-teal-600 hover:bg-teal-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition shadow">Masuk</button>
        `;
      }

      // Render Main Content and Bottom Navigation
      if (appState.currentRole === 'admin') {
        renderAdminNav();
        renderAdminContent();
      } else {
        renderCustomerNav();
        renderCustomerContent();
      }
    }

    // ================= CUSTOMER VIEW =================
    function renderCustomerNav() {
      const nav = document.getElementById('bottom-nav');
      const tabs = [
        { id: 'home', label: 'Beranda', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
        { id: 'order', label: 'Pesan Cetak', icon: 'M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z' },
        { id: 'products', label: 'Katalog', icon: 'M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z' },
        { id: 'profile', label: 'Profil & Order', icon: 'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z' }
      ];

      nav.innerHTML = tabs.map(t => {
        const active = appState.activeTab === t.id;
        return `
          <button onclick="setCustTab('${t.id}')" class="flex flex-col items-center py-1 flex-1 ${active ? 'text-teal-600 font-bold' : 'text-slate-400 font-medium'}">
            <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="${active ? 2.5 : 1.8}"><path stroke-linecap="round" stroke-linejoin="round" d="${t.icon}"></path></svg>
            <span class="text-[10px] leading-none">${t.label}</span>
          </button>
        `;
      }).join('');
    }

    function setCustTab(tab) {
      appState.activeTab = tab;
      renderApp();
    }

    function renderCustomerContent() {
      const main = document.getElementById('main-content');
      if (appState.activeTab === 'home') main.innerHTML = viewCustHome();
      else if (appState.activeTab === 'order') main.innerHTML = viewCustOrder();
      else if (appState.activeTab === 'products') main.innerHTML = viewCustProducts();
      else if (appState.activeTab === 'profile') main.innerHTML = viewCustProfile();
    }

    function viewCustHome() {
      const store = appState.data.storeData;
      const clients = store.clients_slider || [];

      return `
        <div class="space-y-4">
          <!-- Banner Hero -->
          <div class="bg-gradient-to-br from-teal-800 via-teal-700 to-slate-900 rounded-3xl p-5 text-white shadow-md relative overflow-hidden">
            <div class="relative z-10 space-y-2">
              <span class="bg-white/20 text-teal-100 text-[10px] font-black uppercase px-2 py-0.5 rounded-full">Percetakan Modern</span>
              <h2 class="text-xl font-black leading-tight">Cetak Kilat & Presisi Tanpa Antre</h2>
              <p class="text-xs text-teal-100 max-w-sm">Banner MMT, Stiker Vinyl, Kartu Nama & Kebutuhan Promosi Instansi / Usaha Anda.</p>
              <div class="pt-2 flex gap-2">
                <button onclick="setCustTab('order')" class="bg-white text-teal-900 font-bold text-xs px-4 py-2 rounded-xl shadow hover:bg-teal-50 transition">Pesan Sekarang &rarr;</button>
                <button onclick="setCustTab('products')" class="bg-teal-950/60 hover:bg-teal-900 text-white font-semibold text-xs px-3.5 py-2 rounded-xl border border-teal-600/40 transition">Lihat Katalog</button>
              </div>
            </div>
          </div>

          <!-- Slider Instansi Dipercaya -->
          <div class="bg-white rounded-2xl p-3.5 border border-slate-200 shadow-xs space-y-2.5">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">Dipercaya Oleh Berbagai Instansi</span>
              <span class="text-[10px] font-semibold text-teal-600">Geser Otomatis</span>
            </div>
            <div class="overflow-hidden py-1">
              <div class="animate-clients gap-3">
                ${[...clients, ...clients].map(c => `
                  <div class="flex items-center gap-2.5 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl shrink-0">
                    <img src="${c.logo}" class="w-7 h-7 rounded-lg object-cover bg-white" onerror="this.src='https://placehold.co/60x60?text=Logo'">
                    <div>
                      <div class="font-bold text-xs text-slate-800">${c.nama}</div>
                      <div class="text-[9px] text-slate-500 line-clamp-1">${c.keterangan || 'Partner Cetak'}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Produk Populer Grid -->
          <div class="space-y-2">
            <div class="flex justify-between items-center px-1">
              <h3 class="font-bold text-sm text-slate-800">Layanan & Produk Favorit</h3>
              <button onclick="setCustTab('products')" class="text-xs font-bold text-teal-600 hover:underline">Semua Produk &rarr;</button>
            </div>
            <div class="grid grid-cols-2 gap-3">
              ${appState.data.products.slice(0, 4).map(p => `
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs hover:border-teal-400 transition flex flex-col justify-between">
                  <img src="${p.Thumbnail}" class="w-full h-24 object-cover bg-slate-100" onerror="this.src='https://placehold.co/300x200?text=Produk'">
                  <div class="p-3 flex-1 flex flex-col justify-between space-y-2">
                    <div>
                      <span class="text-[9px] font-extrabold uppercase px-1.5 py-0.5 rounded ${p.Kategori === 'meteran' ? 'bg-indigo-50 text-indigo-700' : 'bg-emerald-50 text-emerald-700'}">${p.Kategori}</span>
                      <h4 class="font-bold text-xs text-slate-800 mt-1 line-clamp-2">${p.Nama}</h4>
                    </div>
                    <div class="flex justify-between items-center pt-1 border-t border-slate-100">
                      <span class="font-extrabold text-xs text-teal-700">${formatRp(p.Harga)}</span>
                      <button onclick="selectProductAndOrder('${p.ID}')" class="bg-teal-600 hover:bg-teal-700 text-white text-[10px] font-bold px-2 py-1 rounded-lg">Pesan</button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Info Toko & Rekening -->
          <div class="bg-slate-900 text-white rounded-2xl p-4 space-y-2 text-xs">
            <div class="font-bold text-teal-400 text-sm">${store.nama_toko || 'Alinea Desain'}</div>
            <div class="text-slate-300">📍 ${store.alamat || '-'}</div>
            <div class="text-slate-300">📞 WhatsApp: <span class="text-teal-300 font-bold">${store.kontak || '-'}</span></div>
            <div class="text-slate-300">💳 Rekening: <span class="text-teal-300 font-bold">${store.rekening || '-'}</span></div>
          </div>
        </div>
      `;
    }

    // Katalog Produk
    function viewCustProducts() {
      return `
        <div class="space-y-3">
          <div class="flex justify-between items-center">
            <h2 class="font-bold text-base text-slate-800">Katalog Produk & Biaya</h2>
            <span class="text-xs text-slate-500">${appState.data.products.length} Layanan</span>
          </div>

          <div class="space-y-2.5">
            ${appState.data.products.map(p => `
              <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs flex gap-3 items-center">
                <img src="${p.Thumbnail}" class="w-16 h-16 rounded-xl object-cover shrink-0 bg-slate-100" onerror="this.src='https://placehold.co/100x100?text=Produk'">
                <div class="flex-1 min-w-0 space-y-1">
                  <div class="flex items-center gap-1.5">
                    <span class="text-[9px] font-extrabold uppercase px-1.5 py-0.5 rounded ${p.Kategori === 'meteran' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'}">${p.Kategori}</span>
                    <h4 class="font-bold text-xs text-slate-800 truncate">${p.Nama}</h4>
                  </div>
                  <p class="text-[11px] text-slate-500 line-clamp-1">${p.Deskripsi || '-'}</p>
                  <div class="flex items-center justify-between pt-1">
                    <span class="font-black text-xs text-teal-700">${formatRp(p.Harga)}${p.Kategori==='meteran'?' / m²':''}</span>
                    <button onclick="selectProductAndOrder('${p.ID}')" class="bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold px-3 py-1 rounded-xl shadow-xs">Pesan Ini</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function selectProductAndOrder(pid) {
      appState.selectedProductForOrder = pid;
      appState.activeTab = 'order';
      renderApp();
    }

    // Form Pemesanan
    function viewCustOrder() {

    function onOrderProductChange(pid) {
      appState.selectedProductForOrder = pid;
      const prod = appState.data.products.find(p => p.ID === pid);
      const isMet = prod ? prod.Kategori === 'meteran' : false;
      const metBox = document.getElementById('ord_meteran_box');
      if (metBox) {
        if (isMet) metBox.classList.remove('hidden');
        else metBox.classList.add('hidden');
      }
      recalcOrder();
    }

    function toggleDpInput() {
      const isDp = document.querySelector('input[name="ord_tipe_bayar"]:checked')?.value === 'dp';
      const dpBox = document.getElementById('ord_dp_box');
      if (dpBox) {
        if (isDp) dpBox.classList.remove('hidden');
        else dpBox.classList.add('hidden');
      }
      recalcOrder();
    }

    function recalcOrder() {
      const pid = document.getElementById('ord_prod_id')?.value;
      const prod = appState.data.products.find(p => p.ID === pid);
      if (!prod) return;

      const qty = Number(document.getElementById('ord_qty')?.value || 1);
      let subtotal = 0;

      if (prod.Kategori === 'meteran') {
        const p = Number(document.getElementById('ord_panjang')?.value || 200);
        const l = Number(document.getElementById('ord_lebar')?.value || 100);
        const luas = Math.max(1, (p / 100) * (l / 100));
        subtotal = Math.round(prod.Harga * luas * qty);
      } else {
        subtotal = prod.Harga * qty;
      }

      let jasa = 0;
      if (document.getElementById('ord_chk_desain')?.checked) jasa += (prod.HargaDesain || 15000);
      if (document.getElementById('ord_chk_cutting')?.checked) jasa += (prod.HargaCutting || 5000);
      if (document.getElementById('ord_chk_laminating')?.checked) jasa += (prod.HargaLaminating || 5000);

      const total = subtotal + jasa;
      const elSub = document.getElementById('calc-subtotal');
      const elJas = document.getElementById('calc-jasa');
      const elTot = document.getElementById('calc-total');

      if (elSub) elSub.textContent = formatRp(subtotal);
      if (elJas) elJas.textContent = formatRp(jasa);
      if (elTot) elTot.textContent = formatRp(total);

      const isDp = document.querySelector('input[name="ord_tipe_bayar"]:checked')?.value === 'dp';
      const dpNominal = Number(document.getElementById('ord_dp_nominal')?.value || 0);
      const sisaText = document.getElementById('ord_sisa_pelunasan_text');
      if (sisaText && isDp) {
        const sisa = Math.max(0, total - dpNominal);
        sisaText.textContent = `Sisa pelunasan saat jadi: ${formatRp(sisa)}`;
      }
    }

    // Submit Order Customer
    async function submitCustomerOrder(e) {
      e.preventDefault();
      if (!appState.currentUser) {
        openLoginPortal();
        showToast('Silakan masuk terlebih dahulu!', 'warning');
        return;
      }

      const pid = document.getElementById('ord_prod_id').value;
      const prod = appState.data.products.find(p => p.ID === pid);
      const qty = Number(document.getElementById('ord_qty').value || 1);
      const p = Number(document.getElementById('ord_panjang')?.value || 0);
      const l = Number(document.getElementById('ord_lebar')?.value || 0);
      const finishing = document.getElementById('ord_finishing')?.value || '-';
      const jasaDesain = document.getElementById('ord_chk_desain').checked ? (prod.HargaDesain || 15000) : 0;
      const jasaCutting = document.getElementById('ord_chk_cutting').checked ? (prod.HargaCutting || 5000) : 0;
      const jasaLaminating = document.getElementById('ord_chk_laminating').checked ? (prod.HargaLaminating || 5000) : 0;

      let subtotal = prod.Harga * qty;
      if (prod.Kategori === 'meteran') {
        const luas = Math.max(1, (p / 100) * (l / 100));
        subtotal = Math.round(prod.Harga * luas * qty);
      }
      const totalHarga = subtotal + jasaDesain + jasaCutting + jasaLaminating;

      const isDp = document.querySelector('input[name="ord_tipe_bayar"]:checked')?.value === 'dp';
      const dp = isDp ? Number(document.getElementById('ord_dp_nominal')?.value || 0) : 0;
      const statusBayar = isDp ? (dp >= totalHarga ? 'Lunas' : 'DP Terbayar') : 'Belum Lunas';
      const catatan = document.getElementById('ord_catatan').value || '';

      const newOrder = {
        ID: 'ORD' + Date.now().toString().slice(-6),
        Tgl: new Date().toISOString(),
        KodeCustomer: appState.currentUser.KodeKhusus,
        NamaCustomer: appState.currentUser.Nama,
        NoCustomer: appState.currentUser.NoWA,
        IDProduk: prod.ID,
        NamaProduk: prod.Nama,
        Kategori: prod.Kategori,
        Qty: qty,
        Panjang: p,
        Lebar: l,
        Finishing: finishing,
        JasaCutting: jasaCutting,
        JasaLaminating: jasaLaminating,
        JasaDesain: jasaDesain,
        TotalHarga: totalHarga,
        StatusBayar: statusBayar,
        StatusOrder: 'Order Masuk',
        DP: dp,
        Catatan: catatan
      };

      // Simpan lokal
      appState.data.orders.unshift(newOrder);
      saveLocal(appState.data);

      // Kirim ke Google Apps Script backend jika tersedia
      if (isGas) {
        google.script.run.addOrder(newOrder);
      }

      showToast('Pesanan berhasil dibuat!');
      openOrderDetailModal(newOrder.ID);
      appState.activeTab = 'profile';
      renderApp();
    }

    function updateOrderStatusGAS(orderId, status) {
      const ord = appState.data.orders.find(o => o.ID === orderId);
      if (ord) ord.StatusOrder = status;
      saveLocal(appState.data);
      if (isGas) google.script.run.updateOrderStatus(orderId, status, ord?.NoCustomer || '', '');
      showToast(`Status #${orderId} diubah ke ${status}`);
    }

    function updateOrderBayarGAS(orderId, statusBayar) {
      const ord = appState.data.orders.find(o => o.ID === orderId);
      if (ord) ord.StatusBayar = statusBayar;
      saveLocal(appState.data);
      if (isGas) google.script.run.updateOrderBayar(orderId, statusBayar);
      showToast(`Status bayar diubah ke ${statusBayar}`);
      renderApp();

    // Modal Catat Pengeluaran
    function openModalCatatPengeluaran() {
      Swal.fire({
        title: '<span class="text-sm font-black">Catat Pengeluaran Kas Toko</span>',
        html: `
          <div class="space-y-2.5 text-left text-xs">
            <div>
              <label class="font-bold">Total Pengeluaran (Rp)</label>
              <input type="number" id="swal_exp_total" placeholder="Contoh: 150000" class="w-full p-2 border rounded-xl mt-1">
            </div>
            <div>
              <label class="font-bold">Toko / Supplier</label>
              <input type="text" id="swal_exp_toko" placeholder="Contoh: CV Bahan Grafindo" class="w-full p-2 border rounded-xl mt-1">
            </div>
            <div>
              <label class="font-bold">Keterangan / Beli Apa</label>
              <input type="text" id="swal_exp_detail" placeholder="Contoh: Beli 1 roll MMT 280gr" class="w-full p-2 border rounded-xl mt-1">
            </div>
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: 'Simpan',
        cancelButtonText: 'Batal',
        confirmButtonColor: '#e11d48',
        preConfirm: () => {
          const total = Number(document.getElementById('swal_exp_total').value || 0);
          const toko = document.getElementById('swal_exp_toko').value;
          const detail = document.getElementById('swal_exp_detail').value;
          if (!total || !detail) {
            Swal.showValidationMessage('Mohon isi nominal dan keterangan');
            return false;
          }
          return { total, toko, detail };
        }
      }).then(res => {
        if (res.isConfirmed) {
          const newExp = {
            ID: 'EXP' + Date.now().toString().slice(-6),
            Tgl: new Date().toISOString().split('T')[0],
            Total: res.value.total,
            Toko: res.value.toko || 'Toko Bahan',
            Detail: res.value.detail,
            NotaUrl: ''
          };
          appState.data.expenses.unshift(newExp);
          saveLocal(appState.data);
          if (isGas) google.script.run.addExpense(newExp);
          showToast('Pengeluaran berhasil dicatat!');
          renderApp();
        }
      });
    }

    function deleteExpenseGAS(expId) {
      appState.data.expenses = appState.data.expenses.filter(e => e.ID !== expId);
      saveLocal(appState.data);
      if (isGas) google.script.run.deleteExpense(expId);
      showToast('Pengeluaran dihapus');
      renderApp();
    }

          </div>
        `,
        showCancelButton: true,
        confirmButtonText: 'Simpan Produk',
        cancelButtonText: 'Batal',
        confirmButtonColor: '#0d9488',
        preConfirm: () => {
          const nama = document.getElementById('swal_p_nama').value;
          const kat = document.getElementById('swal_p_kat').value;
          const harga = Number(document.getElementById('swal_p_harga').value || 0);
          const foto = document.getElementById('swal_p_foto').value || 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=400&auto=format&fit=crop&q=80';
          const desc = document.getElementById('swal_p_desc').value;

        if (res.isConfirmed) {

          if (isGas) google.script.run.addProduct(newP);
          showToast('Produk baru berhasil disimpan!');
          renderApp();
        }
      });

        html: `
          <div class="text-left text-xs space-y-3">
            <div class="flex border-b border-slate-200">
              <button id="tab-btn-cust" type="button" onclick="switchLoginTab('customer')" class="flex-1 py-2 font-bold text-center border-b-2 ${defaultRole==='customer'?'border-teal-600 text-teal-700':'border-transparent text-slate-400'}">Customer</button>
              <button id="tab-btn-adm" type="button" onclick="switchLoginTab('admin')" class="flex-1 py-2 font-bold text-center border-b-2 ${defaultRole==='admin'?'border-amber-600 text-amber-700':'border-transparent text-slate-400'}">Administrator</button>
            </div>

            <!-- Panel Customer -->
            <div id="panel-login-cust" class="${defaultRole==='customer'?'block':'hidden'} space-y-2.5">
              <button type="button" onclick="doGoogleLogin()" class="w-full bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-bold py-2.5 rounded-xl flex items-center justify-center gap-2 shadow-xs">
                <span>🌐 Masuk Cepat Akun Google</span>
              </button>
              <div class="text-center text-[10px] text-slate-400 font-semibold">- ATAU DAFTAR / MASUK MANUAL -</div>
              <div>
                <label class="font-bold">Nama Lengkap / No. WA</label>
                <input type="text" id="cust_identifier" placeholder="Nama Anda atau 08..." class="w-full p-2 border rounded-xl mt-1">
              </div>
              <div>
                <label class="font-bold">No. WhatsApp Aktif</label>
                <input type="text" id="cust_nowa" placeholder="08..." class="w-full p-2 border rounded-xl mt-1">
              </div>
              <button type="button" onclick="doCustManualLogin()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-xl shadow-xs">
                Masuk / Buat Akun Customer
              </button>
            </div>

            <!-- Panel Admin -->
            <div id="panel-login-adm" class="${defaultRole==='admin'?'block':'hidden'} space-y-2.5">
              <p class="text-[11px] text-slate-500">Khusus pengelola & kasir percetakan</p>
              <div>
                <label class="font-bold">PIN / Password Admin</label>
                <input type="password" id="adm_password" placeholder="Default: admin123" class="w-full p-2 border rounded-xl mt-1 font-mono">
              </div>
              <button type="button" onclick="doAdminLogin()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl shadow-xs">
                Masuk Sebagai Administrator
              </button>
            </div>
          </div>
        `,
        showConfirmButton: false,
        showCloseButton: true
      });
    }

    window.switchLoginTab = function(role) {
      const btnC = document.getElementById('tab-btn-cust');
      const btnA = document.getElementById('tab-btn-adm');
      const panC = document.getElementById('panel-login-cust');
      const panA = document.getElementById('panel-login-adm');

      if (role === 'customer') {
        btnC.className = 'flex-1 py-2 font-bold text-center border-b-2 border-teal-600 text-teal-700';
        btnA.className = 'flex-1 py-2 font-bold text-center border-b-2 border-transparent text-slate-400';
        panC.classList.remove('hidden');
        panA.classList.add('hidden');
      } else {
        btnC.className = 'flex-1 py-2 font-bold text-center border-b-2 border-transparent text-slate-400';
        btnA.className = 'flex-1 py-2 font-bold text-center border-b-2 border-amber-600 text-amber-700';
        panC.classList.add('hidden');
        panA.classList.remove('hidden');
      }
    };

    window.doGoogleLogin = function() {
      // Demo instant Google sign-in
      let user = appState.data.users.find(u => u.Role === 'customer');
      if (!user) {
        user = {
          ID: 'C' + Date.now(),
          Role: 'customer',
          KodeKhusus: Math.floor(10000000 + Math.random() * 90000000).toString(),
          Nama: 'Pelanggan Google',
          NoWA: '08123456789',
          Alamat: 'Yogyakarta',
          Password: 'cust',
          Email: 'user@gmail.com'
        };
        appState.data.users.push(user);
        saveLocal(appState.data);
      }
      appState.currentUser = user;
      appState.currentRole = 'customer';
      localStorage.setItem(AUTH_KEY, user.ID);
      Swal.close();
      showToast(`Selamat datang, ${user.Nama}!`);
      renderApp();
    };

    window.doCustManualLogin = function() {
      const name = document.getElementById('cust_identifier')?.value.trim();
      const wa = document.getElementById('cust_nowa')?.value.trim();
      if (!name) {
        showToast('Nama wajib diisi!', 'warning');
        return;
      }
      let user = appState.data.users.find(u => u.Nama.toLowerCase() === name.toLowerCase() || (wa && u.NoWA === wa));
      if (!user) {
        user = {
          ID: 'C' + Date.now(),
          Role: 'customer',
          KodeKhusus: Math.floor(10000000 + Math.random() * 90000000).toString(),
          Nama: name,
          NoWA: wa || '08123456789',
          Alamat: 'Yogyakarta',
          Password: 'cust',
          Email: name.toLowerCase().replace(/[^a-z0-9]/g, '') + '@gmail.com'
        };
        appState.data.users.push(user);
        saveLocal(appState.data);
        if (isGas) google.script.run.registerCustomer(user);
      }
      appState.currentUser = user;
      appState.currentRole = 'customer';
      localStorage.setItem(AUTH_KEY, user.ID);
      Swal.close();
      showToast(`Masuk sebagai ${user.Nama}`);
      renderApp();
    };

    window.doAdminLogin = function() {
      const pass = document.getElementById('adm_password')?.value;
      const admin = appState.data.users.find(u => u.Role === 'admin');
      if (admin && (pass === admin.Password || pass === 'admin123')) {
        appState.currentUser = admin;
        appState.currentRole = 'admin';
        appState.adminTab = 'dashboard';
        localStorage.setItem(AUTH_KEY, admin.ID);
        Swal.close();
        showToast('Selamat datang di Panel Admin!');
        renderApp();
      } else {
        showToast('Password Admin salah! (Default: admin123)', 'error');
      }
    };

    function handleLogout() {
      localStorage.setItem(AUTH_KEY, 'LOGGED_OUT');
      appState.currentUser = null;
      appState.currentRole = 'customer';
      appState.activeTab = 'home';
      showToast('Anda telah keluar dari akun.');
      renderApp();
    }

    // Initialize
    window.onload = initApp;
  </script>
</body>
</html>
